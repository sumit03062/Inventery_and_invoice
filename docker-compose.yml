services:
  backend: &backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:3001}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATABASE_PATH: /data/shop.sqlite3
      MEDIA_ROOT: /data/media
    volumes:
      - shop-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  maintenance:
    <<: *backend
    profiles: ["maintenance"]
    command: ["python", "manage.py", "run_maintenance"]
    healthcheck:
      disable: true
    volumes:
      - shop-data:/data
      - ./backups:/backups
    depends_on:
      backend:
        condition: service_healthy
volumes:
  shop-data:
